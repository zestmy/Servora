name: Layout

# Nothing may run off the side of the screen.
#
# Seven screens shipped horizontally overflowing on a phone, and one of them
# put Save and Cancel outside the viewport on the employee form. None of it
# presented as broken — `main` is `overflow-y-auto`, so CSS computes the other
# axis to `auto` too and an over-wide page silently becomes draggable sideways
# instead of visibly failing. Nobody could have caught that by reading a diff,
# which is why it is measured in a browser here.
#
# Separate from deploy.yml on purpose: that workflow ships to production on a
# push to main and must not gain a browser, a database or a build step it does
# not need.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overflow:
    name: No horizontal overflow
    runs-on: ubuntu-latest

    # MySQL rather than SQLite, because production is MySQL and two screens
    # (/hr/overtime-claims, /reports/cost-summary) use MySQL-only SQL — YEAR()
    # and DATE_SUB(… INTERVAL …). Under SQLite they 500, the check reports them
    # as unmeasurable, and the coverage is quietly lost on exactly the kind of
    # dense screen most likely to overflow.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: servora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd, zip, bcmath, intl
          coverage: none
          # JIT OFF, and this is a diagnosis, not a preference. setup-php
          # enables opcache.jit=1235 by default, and PHP 8.2's function-mode
          # JIT miscompiles calls to a trait method used by two classes
          # (php-src GH-17654, fixed in 8.3.19/8.4.5, never backported to
          # 8.2): once the sweep's traffic primed the shared inline cache
          # with Carbon\Carbon, the dashboard — the one screen doing
          # CarbonImmutable arithmetic — 500'd on the paradox "must be of
          # type CarbonImmutable, CarbonImmutable given". Reproduced
          # byte-for-byte on a source-built 8.2.30 with jit=1235, clean
          # with JIT off. JIT buys a layout check nothing. Production is
          # unaffected: FPM defaults to jit_buffer_size=0.
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up the environment
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=servora_test"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=password"
          } >> .env

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # The check drives real pages, and every layout calls @vite — without a
      # manifest each one throws ViteManifestNotFoundException and the run
      # fails on something that is not a layout problem.
      - name: Build assets
        run: npm run build

      - name: Migrate and seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      # Serving and checking are ONE step so the server is guaranteed to
      # outlive the shell that started it — a background process handed off
      # between steps is at the mercy of how the runner tears each one down.
      #
      # ubuntu-latest ships Google Chrome, which is why the dependency is
      # playwright-core: it downloads no browser on install, so `npm ci` stays
      # cheap here and on the 2GB production box that runs the same command.
      - name: Check every screen at phone and tablet widths
        env:
          APP_URL: http://127.0.0.1:8000
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: |
          # KEPT ALIVE BY A SUPERVISOR LOOP, not started once. `artisan serve`
          # is PHP's single-threaded dev server, and it died partway through
          # the first run here — 43 screens into a 129-page sweep — taking the
          # rest of the run with it as ERR_CONNECTION_REFUSED. Whatever kills
          # it (a fatal in one request, the OOM killer) is not worth chasing:
          # a dev server that restarts in under a second is enough, and the
          # check retries a refused navigation once to ride over the gap.
          # PHP_CLI_SERVER_WORKERS is the fix for the cause rather than the
          # symptom. PHP's built-in server is single-process by default, and a
          # browser opening a page fires the document plus its CSS, JS, logos
          # and favicon at once — so requests queue behind each other and the
          # server was dying mid-login under the load, resetting connections.
          # Workers make it handle them concurrently. The supervisor loop stays
          # as the backstop for a death it still cannot survive.
          nohup env PHP_CLI_SERVER_WORKERS=4 bash -c 'while true; do php artisan serve --port=8000; echo "--- server exited, restarting ---"; sleep 1; done' > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/login > /dev/null && break
            if [ "$i" = "30" ]; then
              echo "The app did not come up on :8000"
              cat /tmp/serve.log
              exit 1
            fi
            sleep 1
          done
          set +e
          npm run test:overflow 2>&1 | tee /tmp/check.log
          status=${PIPESTATUS[0]}
          set -e
          # THE EXCEPTIONS THEMSELVES, on every run — not only failures. A
          # 5xx during the sweep is a warning, not a failure (it is not a
          # width problem), so a passing run can still contain one, and its
          # trace in laravel.log is the only evidence. A /dashboard 500 that
          # only ever occurred in CI went undiagnosable because nothing
          # printed it. Collapsed groups, so the check's own verdict stays
          # the first thing anyone reads.
          if grep -q "ERROR" storage/logs/laravel.log 2>/dev/null; then
            echo "::group::laravel.log exceptions"
            grep -A 20 "ERROR" storage/logs/laravel.log | tail -200
            echo "::endgroup::"
          fi
          if grep -qE " 5[0-9][0-9] " /tmp/serve.log 2>/dev/null; then
            echo "::group::serve log 5xx lines"
            grep -E " 5[0-9][0-9] " /tmp/serve.log | tail -20
            echo "::endgroup::"
          fi
          if [ "$status" -ne 0 ]; then
            # LAST 40 LINES, and the check's own output repeated AFTER it.
            # `artisan serve` logs every request, so dumping the whole thing
            # buried the actual failure a thousand lines above the end of the
            # job log — which is the part anyone reads first.
            echo "::group::server log (tail)"
            tail -40 /tmp/serve.log
            echo "::endgroup::"
            echo "──────── overflow check said ────────"
            tail -60 /tmp/check.log
            exit "$status"
          fi
