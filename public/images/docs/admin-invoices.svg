600" fill="#d97706" text-anchor="middle">Draft</text><text x="235" y="470" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">The states an invoice can be in</text><rect x="235" y="488" width="220" height="104" rx="10" fill="#fffbeb"/><rect x="235" y="488" width="3" height="104" rx="2" fill="#d97706"/><text x="251" y="516" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Draft</text><text x="251" y="540" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Your working copy.</text><text x="251" y="557" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Editable, invisible to the</text><text x="251" y="574" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">customer.</text><rect x="467" y="488" width="220" height="104" rx="10" fill="#f0f9ff"/><rect x="467" y="488" width="3" height="104" rx="2" fill="#0284c7"/><text x="483" y="516" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Issued</text><text x="483" y="540" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Sent. The numbers are fixed</text><text x="483" y="557" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">— void it to change them.</text><rect x="699" y="488" width="220" height="104" rx="10" fill="#ecfdf5"/><rect x="699" y="488" width="3" height="104" rx="2" fill="#059669"/><text x="715" y="516" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Paid</text><text x="715" y="540" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Settled. A payment row</text><text x="715" y="557" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">exists to match it.</text><rect x="931" y="488" width="220" height="104" rx="10" fill="#f9fafb"/><rect x="931" y="488" width="3" height="104" rx="2" fill="#9ca3af"/><text x="947" y="516" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Void</text><text x="947" y="540" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Cancelled, but the number</text><text x="947" y="557" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">is kept so the sequence has</text><text x="947" y="574" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">no gaps.</text><rect x="235" y="606" width="915" height="64" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="251" y="632" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start"></text><text x="251" y="632" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Paid subscriptions raise an invoice automatically when the gateway confirms the payment. You raise one by hand</text><text x="251" y="652" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">for a bank transfer, an agreed upgrade, or a credit — and the numbering sequence is shared by both.</text></svg>
