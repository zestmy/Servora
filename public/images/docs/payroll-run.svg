" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">What locking does</text><text x="827" y="538" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">A locked run stops recalculating. Payslips</text><text x="827" y="556" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">and the bank file are generated from the</text><text x="827" y="574" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">locked figures, so a later change to an</text><text x="827" y="592" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">employee&apos;s salary cannot silently rewrite</text><text x="827" y="610" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">a payslip somebody has already been sent.</text><rect x="827" y="630" width="90.4" height="18" rx="9" fill="#fffbeb"/><text x="872.2" y="642.5" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#d97706" text-anchor="middle">IRREVERSIBLE</text></svg>
