<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" role="img"><title>How a purchase moves through Servora</title><rect x="0" y="0" width="1180" height="400" rx="14" fill="#ffffff"/><rect x="0" y="0" width="1180" height="400" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="40" y="48" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start">How one purchase moves through Servora</text><text x="40" y="72" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Each step creates a document. Nothing is retyped — every step is filled from the one before it.</text><rect x="40" y="118" width="190" height="62" rx="10" fill="#eefbf9" stroke="#aeeae4" stroke-width="1"/><text x="135" y="145" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Purchase Request</text><text x="135" y="163" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="middle">What the outlet needs</text><circle cx="56" cy="118" r="11" fill="#0b7677"/><text x="56" y="122" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="234" y1="149" x2="252" y2="149" stroke="#9ca3af" stroke-width="1.5"/><path d="M258 149 l-6 -4 v8 z" fill="#9ca3af"/><rect x="262" y="118" width="190" height="62" rx="10" fill="#eefbf9" stroke="#aeeae4" stroke-width="1"/><text x="357" y="145" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Purchase Order</text><text x="357" y="163" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="middle">What the supplier is told</text><circle cx="278" cy="118" r="11" fill="#0b7677"/><text x="278" y="122" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="456" y1="149" x2="474" y2="149" stroke="#9ca3af" stroke-width="1.5"/><path d="M480 149 l-6 -4 v8 z" fill="#9ca3af"/><rect x="484" y="118" width="190" height="62" rx="10" fill="#eefbf9" stroke="#aeeae4" stroke-width="1"/><text x="579" y="145" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Delivery Order</text><text x="579" y="163" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="middle">What is on the van</text><circle cx="500" cy="118" r="11" fill="#0b7677"/><text x="500" y="122" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><line x1="678" y1="149" x2="696" y2="149" stroke="#9ca3af" stroke-width="1.5"/><path d="M702 149 l-6 -4 v8 z" fill="#9ca3af"/><rect x="706" y="118" width="190" height="62" rx="10" fill="#eefbf9" stroke="#aeeae4" stroke-width="1"/><text x="801" y="145" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Goods Received</text><text x="801" y="163" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="middle">What actually arrived</text><circle cx="722" cy="118" r="11" fill="#0b7677"/><text x="722" y="122" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><line x1="900" y1="149" x2="918" y2="149" stroke="#9ca3af" stroke-width="1.5"/><path d="M924 149 l-6 -4 v8 z" fill="#9ca3af"/><rect x="928" y="118" width="190" height="62" rx="10" fill="#eefbf9" stroke="#aeeae4" stroke-width="1"/><text x="1023" y="145" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Invoice</text><text x="1023" y="163" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="middle">What you are charged</text><circle cx="944" cy="118" r="11" fill="#0b7677"/><text x="944" y="122" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><rect x="40" y="226" width="360" height="130" rx="10" fill="#fffbeb"/><rect x="40" y="226" width="3" height="130" rx="2" fill="#d97706"/><text x="58" y="254" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Approval</text><text x="58" y="278" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">A PR over the approval threshold waits for a</text><text x="58" y="296" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">PO Approver before it can become an order.</text><rect x="420" y="226" width="360" height="130" rx="10" fill="#f0f9ff"/><rect x="420" y="226" width="3" height="130" rx="2" fill="#0284c7"/><text x="438" y="254" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Short delivery</text><text x="438" y="278" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Receive what came. Servora keeps the</text><text x="438" y="296" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">shortfall against the order rather than</text><text x="438" y="314" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">quietly closing it.</text><rect x="800" y="226" width="360" height="130" rx="10" fill="#fef2f2"/><rect x="800" y="226" width="3" height="130" rx="2" fill="#dc2626"/><text x="818" y="254" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Price change</text><text x="818" y="278" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">A unit price above the alert threshold</text><text x="818" y="296" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">raises a price alert and updates the</text><text x="818" y="314" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">ingredient cost.</text></svg>
