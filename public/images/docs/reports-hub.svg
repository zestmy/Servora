CSV, and can be scheduled to arrive by email.</text><rect x="235" y="152" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="251" y="170" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="260" y="179" width="12" height="12" rx="3" fill="#0b7677"/><text x="293" y="184" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Cost analysis</text><text x="251" y="218" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">Food cost by category, against</text><text x="251" y="234" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">target</text><rect x="545" y="152" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="561" y="170" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="570" y="179" width="12" height="12" rx="3" fill="#0b7677"/><text x="603" y="184" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Recipe costing</text><text x="561" y="218" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">Every recipe, its cost and its</text><text x="561" y="234" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">margin</text><rect x="855" y="152" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="871" y="170" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="880" y="179" width="12" height="12" rx="3" fill="#0b7677"/><text x="913" y="184" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Price history</text><text x="871" y="218" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">What each ingredient has cost over</text><text x="871" y="234" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">time</text><rect x="235" y="270" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="251" y="288" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="260" y="297" width="12" height="12" rx="3" fill="#0b7677"/><text x="293" y="302" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Sales report</text><text x="251" y="336" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">Sales by day, category and outlet</text><rect x="545" y="270" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="561" y="288" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="570" y="297" width="12" height="12" rx="3" fill="#0b7677"/><text x="603" y="302" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Purchase summary</text><text x="561" y="336" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">Spend by supplier and by outlet</text><rect x="855" y="270" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="871" y="288" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="880" y="297" width="12" height="12" rx="3" fill="#0b7677"/><text x="913" y="302" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Wastage</text><text x="871" y="336" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">What was thrown away and what it</text><text x="871" y="352" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">cost</text><rect x="235" y="388" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="251" y="406" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="260" y="415" width="12" height="12" rx="3" fill="#0b7677"/><text x="293" y="420" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Labour cost</text><text x="251" y="454" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">Payroll against sales, by outlet</text><rect x="545" y="388" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="561" y="406" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="570" y="415" width="12" height="12" rx="3" fill="#0b7677"/><text x="603" y="420" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Attendance</text><text x="561" y="454" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">Who worked, when, and for how long</text><rect x="855" y="388" width="295" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="871" y="406" width="30" height="30" rx="8" fill="#eefbf9"/><rect x="880" y="415" width="12" height="12" rx="3" fill="#0b7677"/><text x="913" y="420" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Stock movement</text><text x="871" y="454" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">What came in, what went out</text><rect x="235" y="512" width="915" height="158" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="251" y="538" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">AI Analysis writes the commentary</text><text x="251" y="566" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Reports give you the numbers. AI Analysis reads them and writes what changed and why — in the words an outlet</text><text x="251" y="586" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">team uses, not a boardroom summary. It runs on your own data and quotes the figure behind every claim.</text><rect x="251" y="604" width="883" height="48" rx="8" fill="#eefbf9"/><text x="267" y="624" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#0d5f61" text-anchor="start">&quot;Food cost rose 1.4pt to 33.4% this week. Chicken thigh is the whole of it — up 18% since</text><text x="267" y="641" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#0d5f61" text-anchor="start">Tuesday, across 214 kg. At last month&apos;s price the week would have closed at 31.9%.&quot;</text></svg>
