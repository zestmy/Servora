t-anchor="start">Why the workspace is a different colour</text><text x="251" y="606" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Purple is not a status — it says WHERE YOU ARE STANDING. The Central Kitchen workspace shares the product with the</text><text x="251" y="626" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">outlet side but answers a different question: what are we making today, rather than what are we selling today.</text><text x="251" y="646" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">A user attached to a central kitchen switches between the two from the top of the sidebar.</text></svg>
